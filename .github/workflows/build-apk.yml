name: Build ChillFilm Android APKs

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release ChillFilm APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate build version.json
        id: ver
        run: |
          RUN_NUM="${{ github.run_number }}"
          JSON_CODE="$(node -e "const v=require('./version.json'); console.log(Number(v.versionCode)||0)")"
          JSON_NAME="$(node -e "const v=require('./version.json'); console.log(v.versionName||'3.5.0')")"
          JSON_NOTES="$(node -e "const v=require('./version.json'); console.log(v.releaseNotes||'')")"
          CI_CODE=$((100 + RUN_NUM))
          VERSION_CODE=$(( JSON_CODE > CI_CODE ? JSON_CODE : CI_CODE ))
          VERSION_NAME="${JSON_NAME}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const out = {
              versionName: process.env.VERSION_NAME,
              versionCode: Number(process.env.VERSION_CODE),
              buildTime: process.env.BUILD_TIME,
              downloadUrl: "https://github.com/PrimiasArt/Chillfilm.net/releases/download/android-apk-latest/ChillFilm-latest.apk",
              webAppUrl: "https://chillfilm.vercel.app/",
              commit: process.env.COMMIT_SHA,
              releaseNotes: process.env.JSON_NOTES || ("ChillFilm x NKI v" + process.env.VERSION_NAME + " (Build " + process.env.VERSION_CODE + ")")
            };
            fs.writeFileSync("version.json", JSON.stringify(out, null, 2) + "\n");
          '
          cat version.json
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: Run Unit Tests & Build Release APKs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Prepare APK outputs
        run: |
          UNI_APK="app/build/outputs/apk/release/app-universal-release.apk"
          TV32_APK="app/build/outputs/apk/release/app-armeabi-v7a-release.apk"
          cp "$UNI_APK" ChillFilm-latest.apk
          cp "$UNI_APK" "ChillFilm-v${{ steps.ver.outputs.version_name }}.apk"
          if [ -f "$TV32_APK" ]; then
            cp "$TV32_APK" ChillFilm-tv360-32bit.apk
          fi

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillFilm-v${{ steps.ver.outputs.version_name }}-APKs
          path: |
            ChillFilm-latest.apk
            ChillFilm-v${{ steps.ver.outputs.version_name }}.apk
            ChillFilm-tv360-32bit.apk
            version.json
          retention-days: 30

      - name: Create Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: ChillFilm v${{ steps.ver.outputs.version_name }} (Build ${{ steps.ver.outputs.version_code }})
          make_latest: true
          body: |
            ## 🎬 ChillFilm × NKI Ecosystem — v${{ steps.ver.outputs.version_name }}
            - **Phiên bản:** `v${{ steps.ver.outputs.version_name }}` (`versionCode: ${{ steps.ver.outputs.version_code }}`)
            - **Chữ ký cố định (`chillfilm.keystore`):** Cài đè bản mới trực tiếp **không mất API Key, cài đặt phụ đề hay lịch sử xem phim**.
            - **Nâng cấp lớn trong bản này:**
              - 🌐 **Kho phim Đa Nguồn Toàn Cầu & Tự động dịch Song ngữ Anh/Việt**: Đồng bộ 10 nguồn phim sạch (KKPhim 36 quốc gia + 5 nguồn MacCMS quốc tế + Internet Archive + Live Cinema), tự kiểm tra & cào phim mới mỗi 3 giờ, chặn 100% phim sex/cấp 3/phim cấm VN (vẫn cho phép phim 18+ hợp pháp).
              - ❤️ **My List & Lịch sử xem đồng bộ Cloud 2 chiều (Web ↔ Android ↔ Smart TV)** qua NKI Cloud (Neon Postgres + Vercel Blob).
              - ⏭ **Skip Intro (+85s) & Tự chuyển tập (Auto-Next 5s)** trực tiếp trong Chill-Player kèm Audio Boost 200%, Equalizer & Phụ đề AI đa ngôn ngữ.
              - 💻 **Web App đồng bộ đầy đủ (có cả Phòng xem chung Watch Party):** https://chillfilm.vercel.app/

            👉 Tải **`ChillFilm-latest.apk`** (dùng chung cho cả Điện thoại Android & Smart TV/TV360 Box) bên dưới!
          files: |
            ChillFilm-latest.apk
            ChillFilm-v${{ steps.ver.outputs.version_name }}.apk
            ChillFilm-tv360-32bit.apk
            version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Rolling Latest Tag Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: ChillFilm Latest APK (v${{ steps.ver.outputs.version_name }})
          make_latest: false
          body: "Bản dựng tự động mới nhất (versionCode: ${{ steps.ver.outputs.version_code }}). Cài đè trực tiếp không mất dữ liệu cũ."
          files: |
            ChillFilm-latest.apk
            ChillFilm-v${{ steps.ver.outputs.version_name }}.apk
            ChillFilm-tv360-32bit.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
